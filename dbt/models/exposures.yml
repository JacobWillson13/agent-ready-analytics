exposures:
  - name: data_agent
    label: Lanternfly data agent
    type: application
    maturity: medium
    url: https://github.com/YOUR_GITHUB_HANDLE/agent-ready-analytics/tree/main/agent
    description: LangGraph data agent. Reads endorsed marts, dbt docs, guides, and MetricFlow metrics.
    depends_on:
      - ref('dim_orgs')
      - ref('dim_customers')
      - ref('fct_arr_monthly')
      - ref('fct_daily_usage')
      - ref('fct_invoices')
      - ref('fct_support_tickets')
      - ref('fct_pypi_downloads_daily')
    owner: {name: Data Team, email: data@lanternfly.dev}

  - name: customer_360
    label: Customer 360 (Lightdash)
    type: dashboard
    maturity: medium
    url: http://localhost:8080
    description: Account health view joining ARR, usage, and support for each customer.
    depends_on:
      - ref('dim_customers')
      - ref('fct_arr_monthly')
      - ref('fct_daily_usage')
      - ref('fct_support_tickets')
    owner: {name: Data Team, email: data@lanternfly.dev}
